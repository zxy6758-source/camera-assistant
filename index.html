<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구도 도우미</title>
<style>
  :root { --bg:#000; --fg:#fff; --ok:#2ecc71; --warn:#ff9f1a; --none:#8a8a8a; --card:#1b1b1d; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, "Noto Sans KR", sans-serif; }
  body { min-height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 12px 12px; gap:10px; }
  #stage { position:relative; width:100%; background:#111; border-radius:14px; overflow:hidden; aspect-ratio:3/4; }
  video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #banner { font-size:clamp(28px,9vw,48px); font-weight:800; text-align:center; padding:14px 8px; border-radius:14px; background:var(--card); border:4px solid var(--none); }
  #banner.ok { border-color:var(--ok); color:var(--ok); }
  #banner.warn { border-color:var(--warn); color:var(--warn); }
  #issues { margin:0; padding:0 0 0 20px; font-size:17px; line-height:1.5; color:#ddd; }
  #metrics { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; font-size:15px; }
  #metrics div { background:var(--card); border-radius:10px; padding:8px 10px; }
  #metrics b { display:block; font-size:22px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { font-size:15px; color:#ccc; display:flex; gap:6px; align-items:center; }
  select, button { font:inherit; font-size:17px; padding:10px 14px; border-radius:10px; border:0; background:#2a2a2e; color:#fff; }
  button.primary { background:#3478f6; font-weight:700; width:100%; padding:16px; font-size:20px; }
  #log { font-size:14px; color:#9aa; min-height:1.4em; }
  #gallery { display:flex; gap:6px; overflow-x:auto; }
  #gallery img { height:64px; border-radius:6px; }
  #countdown { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:30vw; font-weight:800; color:#fff; text-shadow:0 0 20px #000; }
  #rec { position:absolute; top:10px; left:10px; background:#e53935; padding:4px 10px; border-radius:20px; font-weight:700; display:none; }
  small.note { color:#888; line-height:1.4; }
</style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="countdown"></div>
    <div id="rec">● REC</div>
  </div>

  <div id="banner">시작을 눌러주세요</div>
  <ul id="issues"></ul>
  <div id="metrics"></div>

  <button id="start" class="primary">시작 (카메라·마이크 허용)</button>

  <div class="row">
    <label>촬영 범위
      <select id="mode"><option value="full">전신</option><option value="half">상반신</option></select>
    </label>
    <label>배경 비중
      <select id="bg"><option value="wide">배경 넓게</option><option value="normal" selected>보통</option><option value="tight">인물 중심</option></select>
    </label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="tts" checked> 음성 안내</label>
    <label><input type="checkbox" id="voice" checked> 음성 명령</label>
    <button id="shot">사진</button>
    <button id="vid">동영상</button>
  </div>
  <div id="log"></div>
  <div id="gallery"></div>
  <small class="note">
    음성 명령: “스마일 / 김치 / 촬영 / 찰칵” = 사진(2초 뒤 촬영), “동영상 촬영” = 녹화 시작, “정지” = 녹화 종료.
    이 화면의 카메라를 직접 사용하므로 삼성 카메라 앱은 닫아 두세요(카메라는 한 번에 한 앱만 사용 가능).
  </small>

<script type="module" src="./app.js"></script>
</body>
</html>
