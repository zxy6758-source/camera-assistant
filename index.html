<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구도 도우미</title>
<style>
  :root { --ok:#2ecc71; --warn:#ff9f1a; --none:#9a9a9a; --glass:rgba(0,0,0,.55); }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:#fff; font-family: system-ui, "Noto Sans KR", sans-serif; overflow:hidden; }
  /* 카메라 화면이 전체를 차지하고, 모든 UI는 그 위에 겹친다 → 스크롤 없이 한 화면 */
  #stage { position:fixed; inset:0; background:#000; touch-action:none; }
  video, #overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }

  #top { position:absolute; left:8px; right:8px; top:calc(env(safe-area-inset-top) + 8px); display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  #banner { font-size:clamp(20px,6vw,30px); font-weight:800; text-align:center; padding:8px 10px; border-radius:12px; background:var(--glass); border:3px solid var(--none); }
  #banner.ok { border-color:var(--ok); color:var(--ok); }
  #banner.warn { border-color:var(--warn); color:var(--warn); }
  #issues { margin:0; padding:0; list-style:none; font-size:14px; text-align:center; color:#fff; text-shadow:0 0 4px #000; }
  #metrics { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
  #metrics span { background:var(--glass); border-radius:20px; padding:3px 10px; font-size:13px; }

  #bottom { position:absolute; left:0; right:0; bottom:0; padding:8px 12px calc(env(safe-area-inset-bottom) + 10px); display:flex; flex-direction:column; gap:8px; align-items:center; background:linear-gradient(transparent, rgba(0,0,0,.6)); }
  #zoom { display:flex; gap:6px; position:relative; z-index:2; }
  #zoom button { min-width:48px; padding:6px 10px; font-size:15px; border-radius:20px; background:var(--glass); }
  #zoom button.on { background:#ffd54a; color:#000; font-weight:700; }
  #zoomnote { font-size:12px; color:#ccc; }
  #actions { display:flex; width:100%; justify-content:space-around; align-items:center; }
  button { font:inherit; border:0; color:#fff; background:var(--glass); border-radius:50px; padding:10px 16px; font-size:16px; }
  #shot { width:72px; height:72px; padding:0; background:#fff; border:5px solid rgba(255,255,255,.5); background-clip:padding-box; }
  #vid, #gear { width:56px; height:56px; padding:0; font-size:14px; }
  #log { font-size:12px; color:#ddd; text-shadow:0 0 4px #000; text-align:center; min-height:1em; }

  #panel { position:absolute; inset:auto 8px calc(env(safe-area-inset-bottom) + 130px) 8px; background:rgba(20,20,22,.94); border-radius:14px; padding:12px; display:none; flex-direction:column; gap:10px; max-height:55dvh; overflow:auto; }
  #panel.open { display:flex; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  label { font-size:15px; display:flex; gap:6px; align-items:center; }
  select { font:inherit; padding:8px; border-radius:8px; border:0; background:#333; color:#fff; }
  #gallery { display:flex; gap:6px; overflow-x:auto; }
  #gallery img { height:56px; border-radius:6px; }
  .note { font-size:13px; color:#aaa; line-height:1.5; margin:0; }

  #start { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#3478f6; font-weight:700; font-size:20px; padding:18px 26px; border-radius:16px; }
  #countdown { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:30vw; font-weight:800; text-shadow:0 0 20px #000; pointer-events:none; }
  #rec { position:absolute; top:calc(env(safe-area-inset-top) + 100px); left:12px; background:#e53935; padding:3px 10px; border-radius:20px; font-weight:700; font-size:13px; display:none; }
</style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>

    <div id="top">
      <div id="banner">시작을 눌러주세요</div>
      <ul id="issues"></ul>
      <div id="metrics"></div>
    </div>
    <div id="rec">● REC</div>
    <div id="countdown"></div>

    <button id="start">시작<br><small style="font-weight:400">카메라·마이크 허용 · v6</small></button>

    <div id="panel">
      <div class="row">
        <label>범위
          <select id="mode"><option value="full">전신</option><option value="half">상반신</option></select>
        </label>
        <label>배경
          <select id="bg"><option value="wide">넓게</option><option value="normal" selected>보통</option><option value="tight">인물 중심</option></select>
        </label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="tts" checked> 음성 안내</label>
        <label><input type="checkbox" id="voice" checked> 음성 명령</label>
      </div>
      <div id="gallery"></div>
      <p class="note">
        음성 명령: “스마일 / 김치 / 촬영 / 찰칵” = 사진(2초 뒤), “동영상 촬영” = 녹화 시작, “정지” = 녹화 종료.<br>
        이 화면이 카메라를 직접 사용하므로 삼성 카메라 앱은 닫아 두세요.
      </p>
    </div>

    <div id="bottom">
      <div id="zoom"></div>
      <div id="log"></div>
      <div id="actions">
        <button id="gear">설정</button>
        <button id="shot" aria-label="사진"></button>
        <button id="vid">동영상</button>
      </div>
    </div>
  </div>

<script type="module" src="./app.js?v=6"></script>
</body>
</html>
